name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Typecheck
        run: bun run typecheck

      - name: Build landing site
        run: bun run --cwd apps/landing build

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Test API with coverage gates
        run: bun run test:coverage

      - name: Test CLI
        run: bun run test:cli

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests (desktop + mobile)
        id: e2e
        continue-on-error: true
        run: bun run e2e
        env:
          CI: "1"

      - name: Build screenshot gallery
        if: always()
        run: bun run e2e:gallery
        env:
          PLAYWRIGHT_BRANCH: ${{ github.head_ref || github.ref_name }}
          PLAYWRIGHT_REPORT_URL: ${{ vars.PLAYWRIGHT_PUBLIC_BASE_URL }}/runs/${{ github.run_id }}-${{ github.run_attempt }}/report/index.html
          PLAYWRIGHT_RESULT: ${{ steps.e2e.outcome }}
          PLAYWRIGHT_RUN_ATTEMPT: ${{ github.run_attempt }}
          PLAYWRIGHT_RUN_ID: ${{ github.run_id }}
          PLAYWRIGHT_RUN_NUMBER: ${{ github.run_number }}
          PLAYWRIGHT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAYWRIGHT_SHA: ${{ github.sha }}

      - name: Upload e2e report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
            .e2e-gallery
          if-no-files-found: warn
          retention-days: 14

      - name: Publish screenshot gallery to Hetzner S3
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.S3_REGION }}
          AWS_EC2_METADATA_DISABLED: "true"
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          PLAYWRIGHT_PUBLIC_BASE_URL: ${{ vars.PLAYWRIGHT_PUBLIC_BASE_URL }}
          PLAYWRIGHT_RUN_ATTEMPT: ${{ github.run_attempt }}
          PLAYWRIGHT_RUN_ID: ${{ github.run_id }}
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" || -z "$S3_BUCKET" || -z "$S3_ENDPOINT" || -z "$PLAYWRIGHT_PUBLIC_BASE_URL" ]]; then
            echo "::warning::S3 screenshot publication is not configured; the GitHub artifact still contains the complete gallery."
            exit 0
          fi
          bash scripts/publish-e2e-gallery.sh

      - name: Enforce end-to-end result
        if: steps.e2e.outcome != 'success'
        run: exit 1
