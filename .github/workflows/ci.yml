name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Typecheck
        run: bun run typecheck

      - name: Build landing site
        run: bun run --cwd apps/landing build

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Test API with coverage gates
        run: bun run test:coverage

      - name: Test CLI
        run: bun run test:cli

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests (desktop + mobile)
        id: e2e
        continue-on-error: true
        run: bun run e2e
        env:
          CI: "1"

      - name: Build screenshot gallery
        if: always()
        run: bun run e2e:gallery
        env:
          PLAYWRIGHT_BRANCH: ${{ github.head_ref || github.ref_name }}
          PLAYWRIGHT_REPORT_URL: ${{ vars.PLAYWRIGHT_PUBLIC_BASE_URL }}/runs/${{ github.run_id }}-${{ github.run_attempt }}/report/index.html
          PLAYWRIGHT_RESULT: ${{ steps.e2e.outcome }}
          PLAYWRIGHT_RUN_ATTEMPT: ${{ github.run_attempt }}
          PLAYWRIGHT_RUN_ID: ${{ github.run_id }}
          PLAYWRIGHT_RUN_NUMBER: ${{ github.run_number }}
          PLAYWRIGHT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAYWRIGHT_SHA: ${{ github.sha }}

      - name: Upload e2e report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
            .e2e-gallery
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Enforce end-to-end result
        if: steps.e2e.outcome != 'success'
        run: exit 1
